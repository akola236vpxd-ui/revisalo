name: Actualizar precios y publicar la web

# Cada día descarga los precios de la luz de Red Eléctrica y vuelve a publicar la web.
# También publica la web cada vez que se sube un cambio (por ejemplo, el código de AdSense).
# Los archivos de la web están en la carpeta revisalo-web.
on:
  push:
    branches: [main]
  schedule:
    - cron: "35 19 * * *"
    - cron: "20 21 * * *"
    - cron: "10 23 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar precios de la luz
        run: python revisalo-web/scripts/actualizar_precios.py

      - name: Guardar los precios en el repositorio
        run: |
          if git diff --quiet; then
            echo "No hay precios nuevos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add revisalo-web/datos/precios.json
            git commit -m "Precios de la luz actualizados"
            git push || echo "No se pudo guardar; se publica igualmente."
          fi

      - uses: actions/configure-pages@v5

      - name: Preparar los archivos de la web
        run: |
          mkdir _web
          cd revisalo-web
          cp -r *.html datos favicon.svg og.png apple-touch-icon.png robots.txt sitemap.xml ../_web/
          if [ -f ads.txt ]; then cp ads.txt ../_web/; fi
          for f in google*.html; do [ -f "$f" ] && cp "$f" ../_web/; done; true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _web

      - id: despliegue
        uses: actions/deploy-pages@v4
